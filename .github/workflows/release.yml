name: Build & Automated Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run pre-release validation
        run: |
          bash validate_config.sh
          bash validate_docs.sh

      - name: Run pre-release test suite
        run: bash test.sh --all --available-only --verbose

      - name: Build & Package distribution archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP_NAME="super_hello_world-${TAG}.zip"
          TGZ_NAME="super_hello_world-${TAG}.tar.gz"
          
          zip -r "/tmp/${ZIP_NAME}" . -x ".git/*" ".agents/*" ".kiro/*" ".test_temp/*" ".run_temp/*" "*.zip" "*.tar.gz" "SHA256SUMS"
          tar -czf "/tmp/${TGZ_NAME}" --exclude=".git" --exclude=".agents" --exclude=".kiro" --exclude=".test_temp" --exclude=".run_temp" --exclude="*.zip" --exclude="*.tar.gz" --exclude="SHA256SUMS" .
          mv "/tmp/${ZIP_NAME}" "./${ZIP_NAME}"
          mv "/tmp/${TGZ_NAME}" "./${TGZ_NAME}"
          sha256sum "${ZIP_NAME}" "${TGZ_NAME}" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP_NAME="super_hello_world-${TAG}.zip"
          TGZ_NAME="super_hello_world-${TAG}.tar.gz"
          
          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          gh release delete "${TAG}" --yes || true
          
          gh release create "${TAG}" \
            "${ZIP_NAME}" \
            "${TGZ_NAME}" \
            SHA256SUMS \
            --title "Release ${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG}
